<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="50%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="24"/>
  <!-- Padlock body -->
  <g filter="url(#glow)" transform="translate(150,90)">
    <rect x="20" y="90" width="160" height="130" rx="20" fill="url(#red)"/>
    <!-- Open shackle -->
    <path d="M 60 95 L 60 55 Q 60 15 100 15 Q 140 15 140 55 L 140 75" stroke="url(#red)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="100" cy="140" r="18" fill="#0F0F0F"/>
    <rect x="94" y="140" width="12" height="38" rx="6" fill="#0F0F0F"/>
    <!-- Lightning bolt -->
    <polygon points="112,95 78,155 98,155 88,200 128,138 106,138" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <!-- Text -->
  <text x="400" y="180" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="2">Premium</text>
  <text x="400" y="260" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="url(#red)" letter-spacing="2">Unlock Manager</text>
  <text x="402" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#888888" letter-spacing="6">UNLOCK EVERYTHING • 88 APPS • 288 PATCHES</text>
</svg>
